name: noite_quest
description: Missões noturnas 8-bit para jogar no tempo certo e dormir bem.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  fonts:
    - family: PressStart
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
    - family: Pixelify
      fonts:
        - asset: assets/fonts/PixelifySans.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/icon.png
    background_color: "#15123B"
    theme_color: "#15123B"
